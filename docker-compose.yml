services:
  postgres:
    image: postgres:16
    container_name: fastapi_spa_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: spa_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fastapi_spa_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: fastapi_spa_app
    restart: unless-stopped
    environment:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: spa_db
      DB_HOST: postgres
      DB_PORT: 5432
      PORT: 8000
      APP_NAME: "SPA Salon API"
      ENVIRONMENT: development
      
      JWT_ACCESS_SECRET: supersecretaccesstokenkey1234567890
      JWT_REFRESH_SECRET: supersecretrefreshtokenkey0987654321
      JWT_ACCESS_EXPIRES_MINUTES: 15
      JWT_REFRESH_EXPIRES_DAYS: 7
      
      # НОВЫЕ ПЕРЕМЕННЫЕ ДЛЯ REDIS
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env

volumes:
  postgres_data:
  redis_data:   # НОВЫЙ VOLUME ДЛЯ REDIS